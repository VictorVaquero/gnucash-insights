name: CI

on:
  push:
  pull_request:

jobs:
  install-lint-typecheck-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `vite build` generates src/routeTree.gen.ts (gitignored, tanstackRouter() Vite
      # plugin) — must run before typecheck/test, which import it directly and have no
      # plugin of their own to generate it on a clean checkout.
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run format:check
      - run: pnpm run perf
      - run: pnpm run size
